appId: com.ezoo.pos
productName: EZOO POS
copyright: EZOO POS
directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
asar: true

extraResources:
  - from: ../backend/dist/ezoo-pos
    to: backend
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Code signing — set via environment variables, not hardcoded here.
  # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD (or WIN_CSC_LINK /
  # WIN_CSC_KEY_PASSWORD) at build time.  See CI workflow for the wiring.
  #
  # Signing options (pick one):
  #   1. Azure Trusted Signing — ~$10/mo, cheapest legitimate route.
  #      Set CSC_LINK to the .pfx path and CSC_KEY_PASSWORD to its password.
  #   2. OV certificate — $200-400/year, builds SmartScreen reputation.
  #   3. EV certificate — $400-700/year, immediate SmartScreen trust.
  #   4. Unsigned — fine for single-shop install you deploy yourself.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EZOO POS
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: m-elhabib-dev
  repo: ezoo_pos
